		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;

}

}

}

#status, #status-splash, #status-progress {
	position: absolute;

	right: 0;
}

	top: 0;

}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;

		<script>
// Load the same Godot pack in pieces suitable for this host's file limit.
(() => {
 const fetchFile=window.fetch.bind(window);
 const base=new URL('.',location.href);
 const chunks=["index.pack-fae691ca65d1-0.bin","index.pack-fae691ca65d1-1.bin","index.pack-fae691ca65d1-2.bin","index.pack-fae691ca65d1-3.bin","index.pack-fae691ca65d1-4.bin","index.pack-fae691ca65d1-5.bin","index.pack-fae691ca65d1-6.bin","index.pack-fae691ca65d1-7.bin","index.pack-fae691ca65d1-8.bin","index.pack-fae691ca65d1-9.bin","index.pack-fae691ca65d1-10.bin","index.pack-fae691ca65d1-11.bin","index.pack-fae691ca65d1-12.bin","index.pack-fae691ca65d1-13.bin","index.pack-fae691ca65d1-14.bin","index.pack-fae691ca65d1-15.bin","index.pack-fae691ca65d1-16.bin","index.pack-fae691ca65d1-17.bin","index.pack-fae691ca65d1-18.bin","index.pack-fae691ca65d1-19.bin","index.pack-fae691ca65d1-20.bin","index.pack-fae691ca65d1-21.bin","index.pack-fae691ca65d1-22.bin","index.pack-fae691ca65d1-23.bin","index.pack-fae691ca65d1-24.bin","index.pack-fae691ca65d1-25.bin","index.pack-fae691ca65d1-26.bin","index.pack-fae691ca65d1-27.bin","index.pack-fae691ca65d1-28.bin","index.pack-fae691ca65d1-29.bin"];
 let pack;
 window.fetch=async function(input,options){
  const url=new URL(typeof input==='string'?input:input.url,base);
  if(url.href!==new URL('index.pck',base).href)return fetchFile(input,options);
  const headers={'Content-Type':'application/octet-stream','Content-Length':'122180336'};
  if((options?.method||input?.method)==='HEAD')return new Response(null,{status:200,headers});
  if(!pack)pack=(async()=>{
   const parts=new Array(chunks.length);
   let next=0,finished=0;
   async function worker(){
    while(next<chunks.length){
     const index=next++;
     for(let attempt=0;attempt<4;attempt++){
      try{
       const response=await fetchFile(new URL(chunks[index],base));
       if(!response.ok)throw new Error('Game download failed: '+response.status);
       parts[index]=await response.blob();
       break;
      }catch(error){
       if(attempt===3)throw error;
       await new Promise(resolve=>setTimeout(resolve,1000*(attempt+1)));
      }
     }
     finished++;
     const progress=document.getElementById('status-progress');
     if(progress){progress.max=chunks.length;progress.value=finished;}
    }
   }
   await Promise.all([worker(),worker()]);
   return new Blob(parts,{type:'application/octet-stream'});
  })();
  return new Response(await pack,{status:200,headers});
 };
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":122180336,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
